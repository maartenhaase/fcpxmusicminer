name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build universal app
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: FCPXMusicMiner-macOS-universal
          path: dist/FCPXMusicMiner-macOS-universal.zip
          if-no-files-found: error
