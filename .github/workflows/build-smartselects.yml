name: SmartSelects FCP - maak Mac plugin
on:
  push:
    branches: [smartselects-fcp-extension]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Controleer macOS en Xcode
        run: |
          sw_vers
          xcodebuild -version
      - name: Bouw echte Final Cut Pro Workflow Extension
        env:
          CI_BUILD: "1"
        run: |
          set -euo pipefail
          bash -n SmartSelects/install-and-build.command
          bash SmartSelects/install-and-build.command
      - name: Downloadbare Mac app
        uses: actions/upload-artifact@v4
        with:
          name: SmartSelects-FCP-Installer-Mac
          path: dist/SmartSelects-FCP-macOS.zip
          if-no-files-found: error
          retention-days: 30
